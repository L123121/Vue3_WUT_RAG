# ======================================================================
# Docker Compose — 武理小精灵 生产部署
# 包含: backend (Express) + qdrant (向量数据库)
# 文档存储: SQLite（挂载 volume backend-data）
# 向量检索: Qdrant 固定 v1.12.5（宿主机 nginx 反代 /api 与静态文件，
#          容器版 nginx 已停用，见下方注释）
# ======================================================================
#
# 使用方式:
#   1. 准备 .env.production 文件 (参考 deploy/.env.production.example)
#   2. 配置域名 SSL 证书
#   3. docker compose -p wuli-elf up -d
# ======================================================================

services:
  # ---- 反向代理 ----
  # ⚠️ 已停用：宿主机 80 端口由 host 级 nginx 直接服务（容器版与此冲突，一直处于 Created 状态）。
  # 如需恢复容器版 nginx，先停用 host nginx 再取消下方注释。
  # nginx:
  #   image: nginx:1.27-alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./deploy/nginx.http.conf:/etc/nginx/conf.d/default.conf:ro
  #     - nginx-logs:/var/log/nginx
  #   depends_on:
  #     - backend
  #   restart: unless-stopped
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

  # ---- Express 后端 (API + 前端静态资源) ----
  backend:
    image: ${BACKEND_IMAGE:-wuli-elf-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"  # 仅 nginx 可访问
    env_file:
      - ./deploy/.env.production
    environment:
      - VECTOR_STORE_BACKEND=qdrant
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      - qdrant
    volumes:
      - backend-data:/app/backend/data      # SQLite 数据持久化
      - uploads-data:/app/backend/uploads   # 上传文件临时目录
      - ./ragdata:/app/ragdata:ro           # 知识库文档源文件
      - ./.model-cache:/app/.model-cache:ro # BGE 本地模型文件（离线加载）
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 资源上限：backend 同进程跑 ONNX embedding（BGE 模型）+ reranker + LLM 并发，
    # 不设限会与 qdrant 争抢内存导致整机 OOM（进程被 kill 而非降级）。
    # 数值可用环境变量覆盖，默认按 4C8G 单机留一半给 qdrant 与系统。
    deploy:
      resources:
        limits:
          cpus: ${BACKEND_CPU_LIMIT:-3.0}
          memory: ${BACKEND_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/ready', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---- Qdrant 向量数据库（独立服务） ----
  # ⚠️ 版本固定 v1.12.5：segment.json 使用旧版 on_disk 存储格式，
  # latest 镜像（1.13+）只认 mmap/empty，启动即 panic（2026-08-15 服务器事故）。
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "127.0.0.1:6333:6333"  # REST API（仅本机/nginx 可访问，生产不对外）
      - "127.0.0.1:6334:6334"  # gRPC（可选）
    volumes:
      - qdrant-storage:/qdrant/storage
    # Qdrant 常驻内存随向量规模增长，同样需要上限，避免吞掉整机内存
    deploy:
      resources:
        limits:
          cpus: ${QDRANT_CPU_LIMIT:-2.0}
          memory: ${QDRANT_MEM_LIMIT:-3g}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
    driver: local
  uploads-data:
    driver: local
  qdrant-storage:
    driver: local
