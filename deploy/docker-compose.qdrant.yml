# ======================================================================
# Docker Compose — 武理小精灵 生产部署（Qdrant 版）
# 包含: nginx (SSL 反向代理) + backend (Express) + qdrant (向量库)
# 文档存储: SQLite（挂载 volume backend-data）
# 向量检索: Qdrant 独立服务（唯一后端）
# ======================================================================

services:
  # ---- 反向代理 + SSL 终止 ----
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
      # SSL 证书（用 certbot 或阿里云免费证书）
      - ssl-certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---- Express 后端 (API + 前端静态资源) ----
  backend:
    image: ${BACKEND_IMAGE:-wuli-elf-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"  # 仅 nginx 可访问
    env_file:
      - ./deploy/.env.production
    environment:

      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - PROCESS_ROLE=api
      - JOB_RUNNER_ENABLED=false
      - JOB_SCHEDULER_ENABLED=false
      # 旧镜像不含 @qdrant/js-client-rest：通过 NODE_PATH 指向独立依赖目录，不动镜像自带 node_modules
      - NODE_PATH=/app/qdrant-deps/node_modules
    depends_on:
      - qdrant
      - redis
    volumes:
      - backend-data:/app/backend/data      # SQLite 数据库持久化（应用数据目录为 /app/backend/data，挂错会导致容器重建后读到空库）
      - uploads-data:/app/backend/uploads   # 上传文件临时目录
      # 热补丁：源码挂载（git pull 后重启容器即生效）
      - ./patches/app.js:/app/backend/src/app.js:ro
      - ./patches/rag.service.js:/app/backend/src/services/rag.service.js:ro
      - ./patches/reranker.service.js:/app/backend/src/services/reranker.service.js:ro
      - ./patches/vector-store-qdrant.service.js:/app/backend/src/services/vector-store-qdrant.service.js:ro
      - ./patches/config/index.js:/app/backend/src/config/index.js:ro
      - ./patches/utils/httpClient.js:/app/backend/src/utils/httpClient.js:ro
      # 依赖补充目录：旧镜像不含 @qdrant/js-client-rest，经 NODE_PATH 加载（不动镜像自带 node_modules）
      - ./qdrant-deps:/app/qdrant-deps:ro
      # 知识库文档源与本地模型
      - ./ragdata:/app/ragdata:ro
      - ./.model-cache:/app/.model-cache:ro
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/ready', r => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    image: ${BACKEND_IMAGE:-wuli-elf-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "backend/src/worker.js"]
    env_file:
      - ./deploy/.env.production
    environment:
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      - PROCESS_ROLE=worker
      - JOB_RUNNER_ENABLED=true
      - JOB_SCHEDULER_ENABLED=true
    depends_on:
      - qdrant
      - redis
    volumes:
      - backend-data:/app/backend/data
      - uploads-data:/app/backend/uploads
      - ./ragdata:/app/ragdata:ro
      - ./.model-cache:/app/.model-cache:ro
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # ---- Qdrant 向量数据库（独立服务） ----
  qdrant:
    image: qdrant/qdrant:v1.12.5  # 服务器本地已有该镜像（registry 镜像源拉不到 latest）
    ports:
      - "127.0.0.1:6333:6333"  # REST API（仅本机可访问，不对外）
      - "127.0.0.1:6334:6334"  # gRPC（可选）
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
    driver: local
  uploads-data:
    driver: local
  ssl-certs:
    driver: local
  nginx-logs:
    driver: local
  qdrant-storage:
    driver: local
  redis-data:
    driver: local
