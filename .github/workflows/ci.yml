# ======================================================================
# PR CI — 武理小精灵
# 功能: PR 触发与 deploy.yml check job 同等强度的门禁（Lint → Audit → Test）
# 说明: deploy.yml 仅在 push main 时触发，PR 阶段由本工作流把关，
#       保证进入 main 的代码先通过同一套检查，避免"合入后才发现红灯"
# ======================================================================

name: PR CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "src/**"
      - "public/**"
      - "deploy/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vite-plugin-perf.js"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # RAG 全链路 E2E 依赖本地 BGE 模型缓存；命中缓存则真实跑通，
      # 未命中会在用例内显式失败（rag-pipeline.e2e.test.js），不静默跳过
      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .model-cache
          key: embedding-bge-small-zh-v1.5

      # 缓存未命中时预热模型（首次约 90MB，结束后由 actions/cache 自动保存）
      - name: Warm embedding model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          node -e "
            const path = require('path');
            const { env, pipeline } = require('@huggingface/transformers');
            const cacheDir = path.resolve('..', '.model-cache');
            env.cacheDir = cacheDir;
            env.localModelPath = cacheDir;
            env.allowLocalModels = true;
            env.allowRemoteModels = true;
            pipeline('feature-extraction', 'Xenova/bge-small-zh-v1.5', { dtype: 'q8', cache_dir: cacheDir, local_files_only: false })
              .then(() => console.log('embedding model cached'))
              .catch((err) => { console.error('model warmup failed:', err.message); process.exit(1); });
          "

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      # 离线语料/数据集一致性门禁：数据集地面真值引用的 docId 必须能解析到
      # 语料清单（防止改坏数据集后检索指标静默失真）。零网络依赖
      - name: Dataset & manifest integrity
        run: npm run eval:dataset-check

      - name: Validate quality gate script
        run: |
          mkdir -p /tmp/wut-quality-gate
          printf '{"aggregate":{"recall@5":0.95,"faithfulness":0.90}}' > /tmp/wut-quality-gate/report.json
          RAG_GATE_MIN_RECALL5=0.80 RAG_GATE_MIN_FAITHFULNESS=0.80 npm run eval:quality-gate -- /tmp/wut-quality-gate/report.json

      - name: Validate migration and job assets
        run: |
          test -f backend/src/db/migrations/001_initial_schema.sql
          test -f backend/src/db/migrations/002_background_jobs.sql
          test -f backend/src/services/jobs/job.service.js

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix backend

      - name: Run tests
        run: npm run test:all
        env:
          JWT_SECRET: test-secret
          AI_API_KEY: test-ai-key
