# ======================================================================
# CI/CD Pipeline — 武理小精灵
# 功能: Lint → Test → Build Docker → Push Registry → Deploy to ECS
# ======================================================================
#
# 首次使用前需要在 GitHub Secrets 中添加:
#   DOCKER_USERNAME / DOCKER_PASSWORD  — Docker Hub 账号
#   或
#   ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD — 阿里云容器镜像服务
#
#   ECS_HOST / ECS_USER / ECS_SSH_KEY  — 阿里云 ECS 连接信息
# ======================================================================

name: Deploy to Alibaba Cloud ECS

permissions:
  contents: read

on:
  push:
    branches: [main]
    # 当 backend/ 或 deploy/ 或 Dockerfile 有变更时触发
    paths:
      - "backend/**"
      - "src/**"
      - "public/**"
      - "deploy/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vite-plugin-perf.js"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # 支持手动触发

# 并发控制：连续 push main 会并发触发部署，而回滚依赖「上一版镜像」快照
# （PREVIOUS_IMAGE）。两条流水线同时跑会互相把对方的镜像当成上一版，
# 回滚反而把现场改坏。这里串行化，并只保留最新一次（已在进行的不取消，
# 避免部署到一半被中断留下半成品）。
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # ─── 镜像仓库 ───
  # 在 GitHub 仓库 Settings → Secrets and variables → Actions → Variables 中配置 DOCKER_IMAGE_NAME
  # Option A: Docker Hub，例如 your-dockerhub-username/wuli-elf-backend
  # Option B: 阿里云 ACR（国内部署推荐），例如 registry.cn-hangzhou.aliyuncs.com/your-namespace/wuli-elf-backend
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  # ========== 1. 代码检查和测试 ==========
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # 与 ci.yml 相同的模型缓存：E2E 在 CI 缺缓存时显式失败而非跳过
      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .model-cache
          key: embedding-bge-small-zh-v1.5

      - name: Warm embedding model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          node -e "
            const path = require('path');
            const { env, pipeline } = require('@huggingface/transformers');
            const cacheDir = path.resolve('..', '.model-cache');
            env.cacheDir = cacheDir;
            env.localModelPath = cacheDir;
            env.allowLocalModels = true;
            env.allowRemoteModels = true;
            pipeline('feature-extraction', 'Xenova/bge-small-zh-v1.5', { dtype: 'q8', cache_dir: cacheDir, local_files_only: false })
              .then(() => console.log('embedding model cached'))
              .catch((err) => { console.error('model warmup failed:', err.message); process.exit(1); });
          "

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npm run typecheck

      # 与 ci.yml 相同强度的离线语料/数据集一致性门禁
      - name: Dataset & manifest integrity
        run: npm run eval:dataset-check

      - name: Validate quality gate script
        run: |
          mkdir -p /tmp/wut-quality-gate
          printf '{"aggregate":{"recall@5":0.95,"faithfulness":0.90}}' > /tmp/wut-quality-gate/report.json
          RAG_GATE_MIN_RECALL5=0.80 RAG_GATE_MIN_FAITHFULNESS=0.80 npm run eval:quality-gate -- /tmp/wut-quality-gate/report.json

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix backend

      - name: Run tests
        run: npm run test:all
        env:
          JWT_SECRET: test-secret
          AI_API_KEY: test-ai-key

      # 可选：配置仓库变量 RAG_EVAL_ENABLED=true 后，对部署中的评测 API 执行检索回归基线
      - name: Run RAG retrieval baseline
        if: ${{ vars.RAG_EVAL_ENABLED == 'true' }}
        run: npm run eval:rag-baseline
        env:
          EVAL_API_BASE: ${{ secrets.RAG_EVAL_API_BASE }}
          EVAL_MIN_RECALL5: ${{ vars.RAG_GATE_MIN_RECALL5 || '0.80' }}

      - name: Enforce RAG quality gate
        if: ${{ vars.RAG_EVAL_ENABLED == 'true' }}
        run: |
          RESULT=$(find backend/scripts/rag-eval/results -type f -name 'eval-baseline-*.json' -print | sort | tail -1)
          if [ -z "$RESULT" ]; then
            echo "::error::未找到 RAG baseline 结果文件"
            exit 1
          fi
          RAG_GATE_MIN_RECALL5="${RAG_GATE_MIN_RECALL5}" \
          RAG_GATE_MAX_REGRESSION="${RAG_GATE_MAX_REGRESSION}" \
            npm run eval:quality-gate -- "$RESULT"
        env:
          RAG_GATE_MIN_RECALL5: ${{ vars.RAG_GATE_MIN_RECALL5 || '0.80' }}
          RAG_GATE_MAX_REGRESSION: ${{ vars.RAG_GATE_MAX_REGRESSION || '' }}

      # 评测结果留存为 artifact：跨次部署可对比 Recall/p95 趋势，
      # 这是"指标可复现"闭环的最后一环（结果此前只落在 runner 本地即丢弃）
      - name: Upload eval results artifact
        if: ${{ vars.RAG_EVAL_ENABLED == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-baseline-results-${{ github.sha }}
          path: backend/scripts/rag-eval/results/
          if-no-files-found: ignore
          retention-days: 90
          EVAL_AUTH_TOKEN: ${{ secrets.RAG_EVAL_AUTH_TOKEN }}

  # ========== 2. 构建 & 推送 Docker 镜像 ==========
  build:
    name: Build & Push Docker Image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check image name configuration
        run: |
          if [ -z "$IMAGE_NAME" ]; then
            echo "::error::未配置镜像仓库地址。请在仓库 Settings → Secrets and variables → Actions → Variables 中添加 DOCKER_IMAGE_NAME（例如: your-dockerhub-username/wuli-elf-backend）"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # ── Docker Hub 登录 ──
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 阿里云 ACR 登录（二选一） ──
      # - name: Login to Alibaba Cloud ACR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: registry.cn-hangzhou.aliyuncs.com
      #     username: ${{ secrets.ALIYUN_ACR_USERNAME }}
      #     password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 2.5 镜像漏洞扫描（供应链安全门禁） ==========
  security-scan:
    name: Trivy Image Scan
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Scan pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ========== 3. 部署到 ECS ==========
  deploy:
    name: Deploy to Alibaba Cloud ECS
    # check 显式列出：build 已 needs: check，链路本就传递式成立；
    # 显式声明可避免日后调整 build 依赖时静默放开测试门禁。
    needs: [check, build, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Upload deployment manifests
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,deploy/nginx.conf"
          target: "/opt/wuli-elf/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/wuli-elf

            if [ ! -f deploy/.env.production ]; then
              echo "❌ 缺少 deploy/.env.production，请先在服务器配置生产环境变量"
              exit 1
            fi

            PREVIOUS_IMAGE=$(docker inspect -f '{{.Image}}' "$(docker compose -p wuli-elf ps -q backend)" 2>/dev/null || true)
            export BACKEND_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

            # 拉取最新镜像
            docker compose -p wuli-elf pull backend

            # 确保依赖服务就绪，再重启后端
            docker compose -p wuli-elf up -d qdrant
            docker compose -p wuli-elf up -d --no-deps backend

            # 检查服务健康状态
            echo "等待后端启动..."
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000/api/ready > /dev/null 2>&1; then
                echo "✅ 后端启动成功"
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ 新版本健康检查失败"
              docker compose -p wuli-elf logs --tail=100 backend || true
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "回滚到上一镜像 $PREVIOUS_IMAGE"
                export BACKEND_IMAGE="$PREVIOUS_IMAGE"
                docker compose -p wuli-elf up -d --no-deps backend
              fi
              exit 1
            fi

            docker image prune -f

            # 容器版 nginx 已停用（compose 中注释掉，由宿主机 nginx 直接服务），
            # 此处无 nginx 服务可 reload；nginx.conf 仍随上方 scp 更新以备重新启用。
            # 若恢复容器版 nginx，需在此加回: docker compose -p wuli-elf exec nginx nginx -s reload

            echo "🎉 部署完成: $(date)"
