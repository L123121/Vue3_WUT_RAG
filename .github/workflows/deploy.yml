# ======================================================================
# CI/CD Pipeline — 武理小精灵
# 功能: Lint → Test → Build Docker → Push Registry → Deploy to ECS
# ======================================================================
#
# 首次使用前需要在 GitHub Secrets 中添加:
#   DOCKER_USERNAME / DOCKER_PASSWORD  — Docker Hub 账号
#   或
#   ALIYUN_ACR_USERNAME / ALIYUN_ACR_PASSWORD — 阿里云容器镜像服务
#
#   ECS_HOST / ECS_USER / ECS_SSH_KEY  — 阿里云 ECS 连接信息
# ======================================================================

name: Deploy to Alibaba Cloud ECS

permissions:
  contents: read

on:
  push:
    branches: [main]
    # 当 backend/ 或 deploy/ 或 Dockerfile 有变更时触发
    paths:
      - "backend/**"
      - "src/**"
      - "public/**"
      - "deploy/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "vite-plugin-perf.js"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: # 支持手动触发

env:
  # ─── 镜像仓库（二选一） ───
  # Option A: Docker Hub
  IMAGE_NAME: your-dockerhub-username/wuli-elf-backend
  # Option B: 阿里云 ACR（国内部署推荐）
  # IMAGE_NAME: registry.cn-hangzhou.aliyuncs.com/your-namespace/wuli-elf-backend

jobs:
  # ========== 1. 代码检查和测试 ==========
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Lint
        run: npm run lint:check

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --omit=dev --audit-level=high --prefix backend

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test-secret
          AI_API_KEY: test-ai-key

  # ========== 2. 构建 & 推送 Docker 镜像 ==========
  build:
    name: Build & Push Docker Image
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Docker Hub 登录 ──
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 阿里云 ACR 登录（二选一） ──
      # - name: Login to Alibaba Cloud ACR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: registry.cn-hangzhou.aliyuncs.com
      #     username: ${{ secrets.ALIYUN_ACR_USERNAME }}
      #     password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========== 3. 部署到 ECS ==========
  deploy:
    name: Deploy to Alibaba Cloud ECS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload deployment manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          source: "docker-compose.yml,deploy/nginx.conf"
          target: "/opt/wuli-elf/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/wuli-elf

            if [ ! -f deploy/.env.production ]; then
              echo "❌ 缺少 deploy/.env.production，请先在服务器配置生产环境变量"
              exit 1
            fi

            PREVIOUS_IMAGE=$(docker inspect -f '{{.Image}}' "$(docker compose -p wuli-elf ps -q backend)" 2>/dev/null || true)
            export BACKEND_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"

            # 拉取最新镜像
            docker compose -p wuli-elf pull backend

            # 确保依赖服务就绪，再重启后端
            docker compose -p wuli-elf up -d qdrant
            docker compose -p wuli-elf up -d --no-deps backend

            # 检查服务健康状态
            echo "等待后端启动..."
            HEALTHY=false
            for i in $(seq 1 12); do
              if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
                echo "✅ 后端启动成功"
                HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ 新版本健康检查失败"
              docker compose -p wuli-elf logs --tail=100 backend || true
              if [ -n "$PREVIOUS_IMAGE" ]; then
                echo "回滚到上一镜像 $PREVIOUS_IMAGE"
                export BACKEND_IMAGE="$PREVIOUS_IMAGE"
                docker compose -p wuli-elf up -d --no-deps backend
              fi
              exit 1
            fi

            docker image prune -f

            # 重启 nginx（如果有配置变更）
            docker compose -p wuli-elf exec nginx nginx -s reload 2>/dev/null || true

            echo "🎉 部署完成: $(date)"
